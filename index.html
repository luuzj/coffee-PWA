<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">

    <!-- Iconos para dispositivos iOS -->
    <link rel="apple-touch-icon" href="imagenes/icons/icon-192x192.png">
    
    <!-- Configuración del color del navegador en móviles -->
    <meta name="apple-mobile-web-app-status-bar-style" content="#db4938">
    <meta name="theme-color" content="#db4938">
    
    <title>Coffee PWA</title>
</head>

<body>
    <main>
        <nav>
            <h1>Coffe PWA</h1>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Blog</li>
            </ul>
        </nav>
        <div class="container"></div>
    </main>

    <script src="js/app.js"></script>

    <!-- Registro del Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./serviceworker.js')
            .then((reg) => console.log('Service Worker registrado con éxito:', reg.scope))
            .catch((err) => console.error('Error al registrar Service Worker:', err));
        });
      }
    </script>
</body>
</html>
